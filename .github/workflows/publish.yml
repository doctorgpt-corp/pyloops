name: Build and Publish to PyPI

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

# Serialize releases: two merges landing close together must not race, or the
# second would compute its version before the first has pushed its tag.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # A manual dispatch on any other ref must not cut a release.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write  # For creating releases
      id-token: write  # For publishing to PyPI
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history + all tags: the tags are the record of what has been
          # released, and the step below derives the next version from them.
          fetch-depth: 0
          fetch-tags: true

      - name: Compute release version
        id: version
        run: |
          # pyproject.toml carries the three-segment Loops API version, kept in
          # step with the spec by check-updates.yml. The optional fourth segment
          # - a wrapper-only release on top of an API version that already
          # shipped - is assigned here and never committed back to the repo.
          API=$(grep '^version = ' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/' | cut -d. -f1-3)
          echo "api_version=$API" >> "$GITHUB_OUTPUT"

          # Highest tag already released for this API version: the bare v$API,
          # or one of its v$API.<n> wrapper releases.
          LAST=$(git tag --list "v$API" "v$API.*" --sort=-v:refname | head -1)

          if [ -z "$LAST" ]; then
            NEW="$API"
          else
            N=$(printf '%s' "${LAST#v}" | cut -d. -f4)
            NEW="$API.$(( ${N:-0} + 1 ))"
          fi
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

          case "$NEW" in
            *.*.*.*) echo "is_client_update=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "is_client_update=false" >> "$GITHUB_OUTPUT" ;;
          esac

          # Release only when shipped code moved since the last tag. Merges that
          # touch docs, tests, .claude/ or .github/ alone must not cut one.
          if [ -z "$LAST" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "No tag for API version $API yet - will publish $NEW"
          elif [ -n "$(git diff --name-only "$LAST..HEAD" -- src/ pyproject.toml uv.lock)" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Shipped code changed since $LAST - will publish $NEW"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "No change under src/, pyproject.toml or uv.lock since $LAST - nothing to publish"
          fi

      - name: Set up Python
        if: steps.version.outputs.should_publish == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        if: steps.version.outputs.should_publish == 'true'
        uses: astral-sh/setup-uv@v5

      - name: Build package
        if: steps.version.outputs.should_publish == 'true'
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Stamp the computed version into the runner's checkout only; nothing
          # is committed back. --frozen skips the re-lock and the venv sync,
          # neither of which a build needs.
          uv version --frozen "$NEW_VERSION"
          uv build
          # Fail loudly rather than uploading a wheel under the wrong version.
          wheels=(dist/pyloops-"$NEW_VERSION"-*.whl)
          test -f "${wheels[0]}"
          echo "Built ${wheels[0]}"

      - name: Publish to PyPI
        if: steps.version.outputs.should_publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Don't fail the run if a file for this version is already on PyPI
          # (e.g. a re-run after the release/tag step failed: the same version
          # is recomputed, the upload is skipped and the tag gets created).
          skip-existing: true

      - name: Prepare OpenAPI spec
        if: steps.version.outputs.should_publish == 'true'
        run: |
          cp src/pyloops/openapi.yaml openapi.${{ steps.version.outputs.api_version }}.yml
          echo "Attaching the shipped OpenAPI spec as openapi.${{ steps.version.outputs.api_version }}.yml"

      - name: Create GitHub Release
        if: steps.version.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            ## PyLoops v${{ steps.version.outputs.version }}

            ${{ steps.version.outputs.is_client_update == 'true' && '**Client wrapper update** - Based on Loops API version ' || 'SDK generated from Loops API version ' }}${{ steps.version.outputs.api_version }}

            ### Installation
            ```bash
            pip install pyloops==${{ steps.version.outputs.version }}
            ```

            or with uv:
            ```bash
            uv add pyloops==${{ steps.version.outputs.version }}
            ```

            See [Loops API Documentation](https://loops.so/docs) for usage details.
          files: |
            openapi.${{ steps.version.outputs.api_version }}.yml
          draft: false
          prerelease: false
