name: Build and Publish to PyPI

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # For creating releases
      id-token: write  # For publishing to PyPI
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history + all tags so the release check below can see every
          # published version, not just the tip commit.
          fetch-depth: 0
          fetch-tags: true

      - name: Check if version needs publishing
        id: version-check
        run: |
          # Get current version
          CURRENT_VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # Extract API version (first 3 segments)
          API_VERSION=$(echo "$CURRENT_VERSION" | cut -d. -f1-3)
          echo "api_version=$API_VERSION" >> $GITHUB_OUTPUT

          # Check if this is a client-only update (4 segments)
          NUM_SEGMENTS=$(echo "$CURRENT_VERSION" | awk -F. '{print NF}')
          if [ "$NUM_SEGMENTS" -eq 4 ]; then
            echo "is_client_update=true" >> $GITHUB_OUTPUT
          else
            echo "is_client_update=false" >> $GITHUB_OUTPUT
          fi

          # Publish when this version has not been released yet, detected by the
          # absence of a matching git tag. This is deliberately NOT a HEAD~1 diff:
          # when a version bump and follow-up commits land on main in a single
          # push, the bump isn't in the tip commit and a one-commit-back diff
          # silently skips the release. The release step below creates the
          # v<version> tag, so once published this check skips re-runs and any
          # later pushes that don't change the version.
          if git rev-parse -q --verify "refs/tags/v${CURRENT_VERSION}" >/dev/null; then
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "Tag v${CURRENT_VERSION} already exists - nothing to publish"
          else
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "No tag v${CURRENT_VERSION} yet - will publish"
          fi

      - name: Set up Python
        if: steps.version-check.outputs.should_publish == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        if: steps.version-check.outputs.should_publish == 'true'
        uses: astral-sh/setup-uv@v5

      - name: Build package
        if: steps.version-check.outputs.should_publish == 'true'
        run: uv build

      - name: Publish to PyPI
        if: steps.version-check.outputs.should_publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Don't fail the run if a file for this version is already on PyPI
          # (e.g. a re-run after the release/tag step failed).
          skip-existing: true

      - name: Download and prepare OpenAPI spec
        if: steps.version-check.outputs.should_publish == 'true'
        run: |
          curl -s https://app.loops.so/openapi.yaml -o openapi.${{ steps.version-check.outputs.api_version }}.yml
          echo "Downloaded OpenAPI spec as openapi.${{ steps.version-check.outputs.api_version }}.yml"

      - name: Create GitHub Release
        if: steps.version-check.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version-check.outputs.current_version }}
          name: Release v${{ steps.version-check.outputs.current_version }}
          body: |
            ## PyLoops v${{ steps.version-check.outputs.current_version }}

            ${{ steps.version-check.outputs.is_client_update == 'true' && '**Client wrapper update** - Based on Loops API version ' || 'SDK generated from Loops API version ' }}${{ steps.version-check.outputs.api_version }}

            ### Installation
            ```bash
            pip install pyloops==${{ steps.version-check.outputs.current_version }}
            ```

            or with uv:
            ```bash
            uv add pyloops==${{ steps.version-check.outputs.current_version }}
            ```

            See [Loops API Documentation](https://loops.so/docs) for usage details.
          files: |
            openapi.${{ steps.version-check.outputs.api_version }}.yml
          draft: false
          prerelease: false
